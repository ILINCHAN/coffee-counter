services:
  - type: web
    name: coffee-counter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 30
    healthCheckPath: /
    # 持久磁盘不在 yaml 里声明（Render 会把 disk 段误解析成环境变量导致 502）
    # 请在 Render 控制台手动添加 Disk：mountPath=/data，再设 DATA_DIR=/data
    envVars:
      - key: DATA_DIR
        value: /data
