services:
  - type: web
    name: coffee-counter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 30
    healthCheckPath: /
    # 持久磁盘：保证咖啡记录不丢失（免费版不挂盘会随休眠清空）
    disk:
      name: coffee-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
