services:
  - type: web
    name: coffee-counter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 30
    healthCheckPath: /
    # 免费版不挂持久磁盘：数据存在实例本地，先把项目跑通
    # 后续要保数据不丢，再升级到付费版或加 disk 段
    envVars:
      - key: DATA_DIR
        value: /tmp
